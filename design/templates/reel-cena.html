<!doctype html>
<!--
  Template: reel-cena  (1080x1920)
  Cenas animadas para Reels (usadas pelo reel.py). Cada cena tem animações CSS de entrada
  que o reel.py "congela" e avança quadro a quadro. Aberto no navegador, mostra o estado final.
  Zona segura de Reels: conteúdo entre y=250 e y=1560 (rodapé do app cobre a parte de baixo).

  Campo principal: cena = capa | gancho | problema | solucao | oferta | cta
  Campos por cena (todos com padrão):
    capa:     rotulo, titulo, texto
    gancho:   linhas[] (texto grande), virada (frase de virada)
    problema: rotulo, titulo, itens[{icone, nome, texto}]
    solucao:  rotulo, titulo, itens[{icone,nome}]
    oferta:   selo, oferta{valor,para}, texto
    cta:      titulo, texto, info, instagram
  duracao (s) é preenchido pelo reel.py para o zoom suave do fundo.
-->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .canvas.story.reel { --topo: 290px; --base: 330px; }
  .reel .conteudo { justify-content: center; }
  .reel .topo { position: absolute; top: 0; left: 0; right: 0; }
  .reel .rotulo { margin-bottom: 26px; }

  /* gancho */
  .r-gancho .display { font-size: 190px; line-height: .9; }
  .r-gancho .virada { font-family: var(--f-display); font-weight: 700; font-size: 112px; letter-spacing: -0.03em; color: var(--agua); margin-top: 56px; line-height: 1; }
  .linha { display: block; overflow: hidden; padding-bottom: .06em; }
  .linha > span { display: inline-block; }

  /* problema */
  .r-problema .titulo { font-size: 116px; margin-bottom: 70px; }
  .r-problema .lista { display: flex; flex-direction: column; gap: 46px; }
  .r-problema .lin { display: flex; align-items: center; gap: 40px; }
  .r-problema .lin b { display: block; font-family: var(--f-display); font-weight: 700; font-size: 64px; letter-spacing: -0.02em; line-height: 1.05; }
  .r-problema .lin span.t { display: block; font-size: 40px; color: var(--tx-2); margin-top: 6px; line-height: 1.25; }

  /* solução */
  .r-solucao .titulo { font-size: 136px; line-height: .98; }
  .r-solucao .chips { margin-top: 80px; max-width: 900px; }
  .r-solucao .corpo { margin-top: 40px; font-size: 44px; }

  /* oferta */
  .r-oferta .pilula { align-self: flex-start; margin-bottom: 110px; }
  .r-oferta .oferta .quem { font-size: 60px; margin-top: 50px; font-weight: 600; line-height: 1.12; }
  .r-oferta .corpo { margin-top: 90px; font-size: 44px; }

  /* cta */
  .r-cta .logo { width: 300px; margin-bottom: 70px; }
  .r-cta .titulo { font-size: 116px; }
  .r-cta .corpo { font-size: 46px; margin-top: 30px; }
  .r-cta .info { display: flex; align-items: center; gap: 20px; margin-top: 60px; font-size: 40px; font-weight: 500; color: var(--tx); }
  .r-cta .info .ico { width: 56px; height: 56px; color: var(--royal); }
  .r-cta .arroba { margin-top: 70px; font-family: var(--f-display); font-weight: 700; font-size: 64px; color: var(--royal); letter-spacing: -0.01em; }

  /* capa (grade 4:5 central: y 285..1635) */
  .r-capa .conteudo { justify-content: center; }
  .r-capa .simbolo { width: 200px; height: 200px; margin-bottom: 70px; }
  .r-capa .display { font-size: 150px; line-height: .92; }
  .r-capa .corpo { margin-top: 44px; font-size: 46px; max-width: 860px; }
</style>
<script src="base.js"></script>
</head><body>
<script>
const PADROES = {
  capa: { tema: "noite", rotulo: "Conheça a", titulo: "JN\nHigienização*.*", texto: "Higienização de estofados na sua casa, em *Juazeiro do Norte* e *Barbalha*." },
  gancho: { tema: "noite", linhas: ["Seu sofá", "parece", "limpo."], virada: "Mas não está." },
  problema: { tema: "noite", rotulo: "No tecido e na espuma", titulo: "O que você\nnão vê*:*", itens: [
    { icone: "acaro", nome: "Ácaros e poeira", texto: "que pioram rinite e alergias" },
    { icone: "mancha", nome: "Manchas", texto: "de suor, comida e bebida" },
    { icone: "odor", nome: "Odores", texto: "presos no fundo da espuma" },
  ] },
  solucao: { tema: "royal", rotulo: "A solução", titulo: "Higienização profunda, *na sua casa.*", itens: null, texto: "" },
  oferta: { tema: "noite", selo: "Inauguração", oferta: { valor: "20", para: "para os *10 primeiros*\nclientes" }, texto: "Juazeiro do Norte e Barbalha" },
  cta: { tema: "gelo", titulo: "Peça seu orçamento *por foto.*", texto: "Mande uma foto do estofado no *Direct* ou *WhatsApp*.", info: "Sábados a partir das 12h, domingos e feriados", instagram: "@jn_.higienizacao" },
};
const A = (tipo, atraso) => `a a-${tipo}" style="animation-delay:${atraso}s`;

const CENAS = {
  capa: (s) => `
    <img class="simbolo" src="../logo-simbolo.svg" alt="">
    <div class="rotulo">${JN.rico(s.rotulo)}</div>
    <h1 class="display">${JN.rico(s.titulo)}</h1>
    <p class="corpo">${JN.rico(s.texto)}</p>`,
  gancho: (s) => `
    <h1 class="display">${s.linhas.map((l, i) => `<span class="linha"><span class="${A("mascara", 0.15 + i * 0.22)}">${JN.rico(l)}</span></span>`).join("")}</h1>
    <div class="virada ${A("sobe", 1.5)}">${JN.rico(s.virada)}</div>`,
  problema: (s) => `
    <div class="rotulo ${A("surge", 0.05)}">${JN.rico(s.rotulo)}</div>
    <h2 class="titulo ${A("sobe", 0.1)}">${JN.rico(s.titulo)}</h2>
    <div class="lista">${s.itens.map((it, i) => `
      <div class="lin ${A("esq", 0.7 + i * 0.45)}">
        ${JN.seloIcone({ icone: it.icone, tam: 170, cor: "var(--royal)", corIcone: "var(--branco)", seed: 20 + i, traco: 3.2 })}
        <div><b>${JN.esc(it.nome)}</b><span class="t">${JN.rico(it.texto)}</span></div>
      </div>`).join("")}</div>`,
  solucao: (s) => `
    <div class="rotulo ${A("surge", 0.05)}">${JN.rico(s.rotulo)}</div>
    <h2 class="titulo ${A("sobe", 0.15)}">${JN.rico(s.titulo)}</h2>
    <div class="chips">${(s.itens || JN.ITENS_PADRAO).map((it, i) => `<span class="chip ${A("escala", 0.9 + i * 0.16)}">${JN.ico(it.icone, 50)}${JN.esc(it.nome)}</span>`).join("")}</div>
    ${s.texto ? `<p class="corpo ${A("surge", 1.9)}">${JN.rico(s.texto)}</p>` : ""}`,
  oferta: (s) => `
    <span class="pilula ${A("surge", 0.05)}">${JN.esc(s.selo)}</span>
    ${JN.oferta(s.oferta, 330, { x: -300, y: -70, r: -40, b: -90 }, { fundo: "escala:0.15", valor: "escala:0.3", quem: "sobe:0.9" })}
    <p class="corpo ${A("surge", 1.4)}">${JN.rico(s.texto)}</p>`,
  cta: (s) => `
    <img class="logo ${A("escala", 0.05)}" src="../logo.svg" alt="JN Higienização">
    <h2 class="titulo ${A("sobe", 0.35)}">${JN.rico(s.titulo)}</h2>
    <p class="corpo ${A("sobe", 0.6)}">${JN.rico(s.texto)}</p>
    <div class="info ${A("surge", 1.0)}">${JN.ico("calendario", 56, "", 3.4)}<span>${JN.rico(s.info)}</span></div>
    <div class="arroba ${A("sobe", 1.3)}">${JN.esc(s.instagram)}</div>`,
};

const DECO = {
  noite: (d) => `
    ${JN.formaBlob({ x: 600, y: -220, w: 700, h: 640, cor: "var(--noite-2)", seed: 4, n: 6, irregular: .18 })}
    ${JN.formaBlob({ x: -300, y: 1450, w: 900, h: 700, cor: "var(--noite-2)", seed: 21, n: 7, irregular: .16 })}
    <div class="flutua" style="--dur:${d}s;position:absolute;inset:0">
      ${JN.bolha({ x: 920, y: 420, r: 54, cor: "var(--agua)", traco: 3, opacidade: .55 })}
      ${JN.bolha({ x: 840, y: 520, r: 16, cor: "var(--agua)", traco: 3, opacidade: .55 })}
      ${JN.bolha({ x: 1000, y: 560, r: 9, cheia: true, cor: "var(--agua)" })}
      ${JN.bolha({ x: 140, y: 1500, r: 12, cheia: true, cor: "var(--agua)", opacidade: .8 })}
    </div>`,
  royal: (d) => `
    ${JN.formaBlob({ x: 560, y: -200, w: 760, h: 700, cor: "var(--noite)", seed: 14, n: 7, irregular: .15, opacidade: .22 })}
    ${JN.formaBlob({ x: -260, y: 1420, w: 860, h: 640, cor: "var(--noite)", seed: 6, n: 6, irregular: .18, opacidade: .22 })}
    <div class="flutua" style="--dur:${d}s;position:absolute;inset:0">
      ${JN.bolha({ x: 930, y: 460, r: 54, cor: "var(--agua-clara)", traco: 3, opacidade: .6 })}
      ${JN.bolha({ x: 850, y: 560, r: 15, cor: "var(--agua-clara)", traco: 3, opacidade: .6 })}
      ${JN.bolha({ x: 1004, y: 590, r: 9, cheia: true, cor: "var(--agua-clara)" })}
    </div>`,
  gelo: (d) => `
    ${JN.formaBlob({ x: 600, y: -160, w: 700, h: 600, cor: "var(--agua)", seed: 9, n: 7, irregular: .16, opacidade: .2 })}
    ${JN.formaBlob({ x: -280, y: 1400, w: 860, h: 680, cor: "var(--agua)", seed: 17, n: 7, irregular: .16, opacidade: .16 })}
    <div class="flutua" style="--dur:${d}s;position:absolute;inset:0">
      ${JN.bolha({ x: 930, y: 470, r: 44, cor: "var(--royal)", traco: 3, opacidade: .35 })}
      ${JN.bolha({ x: 990, y: 550, r: 10, cheia: true, cor: "var(--agua)" })}
    </div>`,
};

JN.montar((s) => {
  const cena = s.cena || "gancho";
  const d = Object.assign({}, PADROES[cena], s);
  const dur = d.duracao || 4;
  return `
<div class="canvas story reel r-${cena} tema-${d.tema}">
  <div class="deco zoom" style="--dur:${dur}s">${DECO[d.tema](dur)}</div>
  <div class="conteudo">
    ${cena === "capa" || cena === "cta" ? "" : `<div class="topo a a-surge">${JN.marca()}</div>`}
    ${CENAS[cena](d)}
  </div>
</div>`;
}, {});
</script>
</body></html>
