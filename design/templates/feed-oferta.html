<!doctype html>
<!--
  Template: feed-oferta  (1080x1350)
  Capa de oferta / lançamento. Campos (todos opcionais, há valores-demo):
    rotulo, titulo, subtitulo, selo, oferta{valor,para}, itens[{icone,nome}], cta, cta_sub, instagram, cidades, tema (noite|royal)
  Marcação em textos: *acento*  _limão_  \n quebra  ~ espaço inseparável
-->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .f-oferta .conteudo { gap: 0; }
  .f-oferta .display { font-size: 204px; margin-top: 14px; }
  .f-oferta .sub { max-width: 820px; margin-top: 30px; font-size: 42px; }
  .f-oferta .meio { flex: 1; display: flex; align-items: center; justify-content: space-between; gap: 40px; padding: 36px 0 40px; }
  .f-oferta .meio .itens { padding-left: 40px; border-left: 2px solid var(--linha); }
  .f-oferta .rodape { margin-top: 34px; }
</style>
<script src="base.js"></script>
</head><body>
<script>
const DEMO = {
  tema: "noite",
  selo: "Inauguração",
  rotulo: "Agora no Cariri",
  titulo: "Chegamos*.*",
  subtitulo: "Higienização de estofados na sua casa,\nem *Juazeiro do Norte* e *Barbalha*.",
  oferta: { valor: "20", para: "para os *10 primeiros*\nclientes" },
  itens: JN.ITENS_PADRAO,
  cta: "Chame no WhatsApp",
  cta_sub: "link na bio · ou pelo Direct",
};
JN.montar((s) => `
<div class="canvas f-oferta tema-${s.tema}">
  <div class="deco">
    ${JN.formaBlob({ x: 760, y: -180, w: 520, h: 460, cor: "var(--noite-2)", seed: 4, n: 6, irregular: .18 })}
    ${JN.bolha({ x: 946, y: 214, r: 44, cor: "var(--agua)", traco: 3, opacidade: .6 })}
    ${JN.bolha({ x: 872, y: 252, r: 13, cor: "var(--agua)", traco: 3, opacidade: .6 })}
    ${JN.bolha({ x: 1004, y: 280, r: 8, cheia: true, cor: "var(--agua)" })}
    ${JN.bolha({ x: 560, y: 1040, r: 12, cheia: true, cor: "var(--agua)", opacidade: .9 })}
  </div>
  <div class="conteudo">
    <div class="topo">${JN.marca()}${s.selo ? `<span class="pilula">${JN.esc(s.selo)}</span>` : ""}</div>
    <div style="height:50px"></div>
    <div class="rotulo">${JN.rico(s.rotulo)}</div>
    <h1 class="display" data-fit="140">${JN.rico(s.titulo)}</h1>
    <p class="corpo sub">${JN.rico(s.subtitulo)}</p>
    <div class="meio">
      ${JN.oferta(s.oferta, 250, { x: -250, y: -70, r: -10, b: -110 })}
      ${JN.itens(s.itens)}
    </div>
    ${JN.cta(s.cta, s.cta_sub)}
    ${JN.rodape(s)}
  </div>
</div>`, DEMO);
</script>
</body></html>
