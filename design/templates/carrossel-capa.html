<!doctype html>
<!--
  Template: carrossel-capa  (1080x1350)
  Capa de carrossel educativo: número gigante + título + ícone.
  Campos: rotulo, numero, titulo, icone, total (nº de cards), instagram, tema (royal|noite)
-->
<html lang="pt-BR"><head><meta charset="utf-8">
<link rel="stylesheet" href="base.css">
<style>
  .c-capa .linha1 { display: flex; align-items: flex-end; justify-content: space-between; margin-top: 90px; }
  .c-capa .numero { font-family: var(--f-display); font-weight: 700; font-size: 600px; line-height: .74; letter-spacing: -0.06em; color: var(--agua-clara); margin-left: -18px; }
  .c-capa .titulo { font-size: 112px; margin-top: 84px; }
  .c-capa .espaco { flex: 1; }
  .c-capa .rodape .arraste { color: var(--tx); }
</style>
<script src="base.js"></script>
</head><body>
<script>
const DEMO = {
  tema: "royal",
  rotulo: "Guia rápido de estofados",
  numero: "5",
  titulo: "sinais de que seu sofá precisa de *higienização*",
  icone: "sofa",
  total: 7,
};
JN.montar((s) => `
<div class="canvas c-capa tema-${s.tema}">
  <div class="deco">
    ${JN.formaBlob({ x: 720, y: 1000, w: 700, h: 640, cor: "var(--noite)", seed: 7, n: 7, irregular: .16, opacidade: .22 })}
    ${JN.bolha({ x: 600, y: 380, r: 30, cor: "var(--agua-clara)", traco: 3, opacidade: .7 })}
    ${JN.bolha({ x: 556, y: 450, r: 10, cheia: true, cor: "var(--agua-clara)" })}
    ${JN.bolha({ x: 1000, y: 230, r: 12, cor: "var(--agua-clara)", traco: 3, opacidade: .7 })}
  </div>
  <div class="conteudo">
    <div class="topo">${JN.marca()}<span class="pilula">${JN.esc(s.rotulo)}</span></div>
    <div class="linha1">
      <div class="numero">${JN.esc(s.numero)}</div>
      ${JN.seloIcone({ icone: s.icone, tam: 380, cor: "var(--noite)", corIcone: "var(--agua-clara)", seed: 5, traco: 2.6 })}
    </div>
    <h1 class="titulo" data-fit="80">${JN.rico(s.titulo)}</h1>
    <div class="espaco"></div>
    <div class="rodape"><span class="handle">${JN.esc(s.instagram || "@jn_.higienizacao")}</span><span class="arraste">Arraste para o lado ${JN.ico("seta", 40, "", 4)}</span></div>
  </div>
</div>`, DEMO);
</script>
</body></html>
