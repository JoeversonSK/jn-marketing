name: Relógio da fila

# Mantém um "relógio" ligado: confere a fila a cada 5 minutos por ~5h40 e depois se reinicia.
# Não depende do agendador do GitHub (que atrasa ou pula em repositórios novos).
on:
  workflow_dispatch:
  schedule:
    - cron: "7 */3 * * *"   # reserva: religa o relógio se ele tiver parado

permissions:
  contents: write
  actions: write

concurrency:
  group: relogio
  cancel-in-progress: false

jobs:
  relogio:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Conferir a fila a cada 5 minutos
        env:
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          MIDIA_BASE_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
        run: |
          fim=$(( $(date +%s) + 340*60 ))
          volta=0
          while [ "$(date +%s)" -lt "$fim" ]; do
            git pull -q --rebase -X theirs origin main || git rebase --abort 2>/dev/null
            echo "== $(TZ=America/Sao_Paulo date '+%d/%m %H:%M')"
            python -m jn.publicar || true
            # métricas do painel "Resultados": na largada e depois de hora em hora
            if [ $((volta % 12)) -eq 0 ]; then python -m jn.metricas || true; fi
            volta=$((volta + 1))
            bash .github/scripts/salvar_fila.sh
            sleep 300
          done
      - name: Religar o relógio
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run relogio.yml --repo "$GITHUB_REPOSITORY" --ref main
